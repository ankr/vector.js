# Workflow for releasing package to npm registry
name: Release to NPM
on:
  pull_request:
    types:
      - closed # Only run after PRs have been merged or closed
    branches:
      - main # Only run for PRs targeted against main branch
  # Manual run: publish the version currently in package.json on main, without bumping it.
  # Use this to retry a release whose version bump was already pushed but failed to publish.
  workflow_dispatch:

jobs:
  release:
    # Run manually, or for pull requests that has been merged (not closed) and that doesn't have `skip-release` label
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'skip-release') == false)
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push version bump commit and tag
      id-token: write # npm trusted publishing (OIDC), no npm token needed
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          # fetch-depth: 0 # fetch all commits so auto-changelog is correctly generating
          # token: ${{ secrets.BOT_ACCESS_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          scope: '@ankr'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: npm ci

      # No explicit build step: `npm publish` runs the `prepack` script, which builds dist/

      - name: Setup git config
        run: |
          git config --global user.email "mail@ankr.dk"
          git config --global user.name "AUTO RELEASE"

      # Apply proper semver according to github labels

      - name: Major label detected
        if: contains(github.event.pull_request.labels.*.name, 'major')
        run: npm version major

      - name: Minor label detected
        if: contains(github.event.pull_request.labels.*.name, 'minor')
        run: npm version minor

      - name: Patch label detected
        if: contains(github.event.pull_request.labels.*.name, 'patch')
        run: npm version patch

      - name: Git push
        if: github.event_name == 'pull_request'
        run: git push origin main && git push --tags

      - name: Release Package
        run: npm publish
